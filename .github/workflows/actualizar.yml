name: Actualizar resultados

on:
  schedule:
    # Cada 5 minutos entre las 10:00 y las 22:59, hora de Argentina (GitHub usa UTC; Argentina es UTC-3).
    # El script solo consulta la web si hay un sorteo pendiente.
    - cron: "*/5 13-23 * * *"
    - cron: "*/5 0-1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-resultados
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer resultados
        run: python scripts/actualizar.py

      - name: Guardar si hay datos nuevos
        run: |
          if [ -n "$(git status --porcelain data/resultados.json)" ]; then
            git config user.name "actualizador"
            git config user.email "actualizador@users.noreply.github.com"
            git add data/resultados.json
            git commit -m "Resultados actualizados"
            git pull --rebase
            git push
          fi
